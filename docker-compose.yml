services:
  bot:
    build: .
    container_name: crypto-bot
    # Redémarre automatiquement après un crash ou un reboot du serveur : 24h/24, 7j/7.
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
